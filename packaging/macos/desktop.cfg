// Desktop defaults ship in the app. User overrides may live
// in Application Support/Frontline/warcraft-3/autoexec.cfg.
// The launcher supplies the initial map exactly once as a late command.
set cl_start_menu ""
set com_maxfps "60"
set skip_cutscene "1"
set fs_expansion "0"
set vid_title "Frontline: Island Command"
set r_cursor "0"
set cl_context_cursor "1"
set r_vsync "1"
set vid_native "0"
set vid_fullscreen "0"
set vid_mode "13"
set r_render_scale "100"
bind MOUSE1 "+select"
bind MOUSE2 "+smart"
bind MOUSE3 "+pan"
bind ALT+MOUSE1 "+pan"
bind F2 "exec Profiles/performance.cfg"
bind F3 "exec Profiles/balanced.cfg"
bind F4 "exec Profiles/high.cfg"
bind F7 "load quick"
bind F11 "exec Profiles/fullscreen.cfg"
bind ALT+ENTER "exec Profiles/fullscreen.cfg"
// macOS reserves F11 for Show Desktop unless fn is held; Control-F also toggles.
bind CTRL+F "exec Profiles/fullscreen.cfg"

// Select a production building; right-click sets its rally, Control-R clears it.
bind CTRL+R "clearrally"
// Rotate a selected building, or the accepted site of a selected engineer.
bind [ "rotatebuilding -1"
bind ] "rotatebuilding 1"

// Matching visible producers on double-click, including trackpad clicks.
set cl_same_type_select "1"
bind ALT+1 "formation line"
bind ALT+2 "formation column"
bind ALT+3 "formation wedge"
bind ALT+4 "formation defensive"
